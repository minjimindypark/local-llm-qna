<?xml version="1.0" encoding="UTF-8"?>
<svg class="dg" viewBox="0 0 760 280" role="img" aria-label="Every reader's question is answered from the source, handed to the author when the source has no answer, or refused when it is misuse. The system never fills the gap with a guess.">
